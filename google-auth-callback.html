<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f6f7fb;
        color: #1f2937;
      }

      .status {
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div class="status">Finishing Google login...</div>
    <script>
      (function () {
        var search = new URLSearchParams(window.location.search);
        var hashString = window.location.hash && window.location.hash.startsWith('#')
          ? window.location.hash.slice(1)
          : '';
        var hash = new URLSearchParams(hashString);

        var payload = {
          type: 'agenda-book-auth-callback',
        };

        var errorMessage =
          search.get('error_description') ||
          search.get('error') ||
          hash.get('error_description') ||
          hash.get('error');

        if (errorMessage) {
          payload.error = errorMessage;
        } else if (search.get('code')) {
          payload.code = search.get('code');
        } else if (hash.get('access_token') && hash.get('refresh_token')) {
          payload.accessToken = hash.get('access_token');
          payload.refreshToken = hash.get('refresh_token');
        } else {
          payload.error = 'Missing OAuth callback data.';
        }

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, window.location.origin);
        }

        window.setTimeout(function () {
          window.close();
        }, 40);
      })();
    </script>
  </body>
</html>
