      // Pin background size to the physical screen dimensions so the browser
      // never needs to recalculate it, eliminating the cover/size-change flash.
      var dw = ((window.screen.width * window.devicePixelRatio) | 0) + 'px';
      var dh = ((window.screen.height * window.devicePixelRatio) | 0) + 'px';
      document.documentElement.style.setProperty('--display-width', dw);
      document.documentElement.style.setProperty('--display-height', dh);
      // Apply a solid background fallback when running in a browser (no window transparency).
      if (!navigator.userAgent.includes('Electron')) {
        document.documentElement.classList.add('browser-env');
      }
    </script>
